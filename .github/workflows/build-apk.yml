name: Build and publish APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SPEED_CAMERA_VERSION_CODE: ${{ github.run_number }}
      SPEED_CAMERA_VERSION_NAME: 1.0.${{ github.run_number }}
      SPEED_CAMERA_OFFLINE_CATALOG_URL: ${{ github.repository == 'kill-samurai/speed-camera-offline-maps' && 'https://github.com/kill-samurai/speed-camera-offline-maps/releases/download/maps-2026-08-11/catalog.json' || vars.OFFLINE_CATALOG_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore signing key
        if: github.event_name != 'pull_request' && github.repository == 'kill-samurai/speed-camera-offline-maps'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/speed-camera-release.jks"

      - name: Test, lint, and build pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Test, lint, and build signed release
        if: github.event_name != 'pull_request' && github.repository == 'kill-samurai/speed-camera-offline-maps'
        env:
          SPEED_CAMERA_KEYSTORE_PATH: ${{ runner.temp }}/speed-camera-release.jks
          SPEED_CAMERA_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SPEED_CAMERA_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SPEED_CAMERA_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      - name: Test, lint, and build fork
        if: github.event_name != 'pull_request' && github.repository != 'kill-samurai/speed-camera-offline-maps'
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          if [ "$GITHUB_REPOSITORY" = "kill-samurai/speed-camera-offline-maps" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/speed-camera-latest.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/speed-camera-fork-debug.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk

      - name: Upload workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: speed-camera-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kill-samurai/speed-camera-offline-maps'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk dist/speed-camera-latest.apk --clobber
          else
            gh release create latest-apk dist/speed-camera-latest.apk \
              --title "Latest Speed Camera APK" \
              --notes "Automatically built and signed from the latest main branch. Download speed-camera-latest.apk and sideload it on Android." \
              --prerelease
          fi
    permissions:
      contents: write
